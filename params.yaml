# ─────────────────────────────────────────────
# params.yaml  –  DVC-tracked parameter file
# Edit values here; run `dvc repro` to retrain
# ─────────────────────────────────────────────

base:
  year_cutoff: 2000
  random_state: 42
  test_size: 0.20

data:
  raw_dir: data/raw
  processed_dir: data/processed
  processed_file: data/processed/master.csv
  strategy_table: data/processed/strategy_table.csv

models:
  output_dir: models

classification:
  logistic_regression:
    max_iter: 1000
  decision_tree:
    max_depth: 8
  random_forest:
    n_estimators: 100
    n_jobs: -1
  svm:
    probability: true
  naive_bayes: {}

regression:
  ridge:
    alpha: 1.0
  lasso:
    alpha: 0.1
    max_iter: 2000

clustering:
  kmeans:
    n_clusters: 5
    n_init: 10

evaluation:
  metrics_file: models/metrics.json
  feature_importance_file: models/feature_importance.json
