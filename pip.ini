# pip.ini – Place this file at:
#   Windows: C:\Users\<YourName>\pip\pip.ini
#   OR in the project root (pip reads it automatically)
#
# This fixes: SSL: CERTIFICATE_VERIFY_FAILED errors on corporate/college networks

[global]
trusted-host =
    pypi.org
    files.pythonhosted.org
    pypi.python.org
