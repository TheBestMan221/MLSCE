version: "3.9"

# ─────────────────────────────────────────────────────
# docker-compose.yml  –  F1 ML Prediction System
# Usage:
#   docker-compose up --build       # build & run
#   docker-compose up -d            # detached mode
#   docker-compose down             # stop
# ─────────────────────────────────────────────────────

services:
  f1-app:
    build:
      context: .
      dockerfile: Dockerfile
    image: f1-ml-app:latest
    container_name: f1_streamlit_app
    ports:
      - "8501:8501"
    volumes:
      # Mount models & data so you can retrain without rebuilding image
      - ./models:/app/models
      - ./data:/app/data
      - ./mlops/experiments:/app/mlops/experiments
      - ./mlops/model_registry/registry.json:/app/mlops/model_registry/registry.json
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# Optional: add a training service to run train inside Docker
  f1-train:
    build:
      context: .
      dockerfile: Dockerfile
    image: f1-ml-app:latest
    container_name: f1_trainer
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlops:/app/mlops
    command: python src/train_models.py
    profiles:
      - train   # only runs with: docker-compose --profile train up
